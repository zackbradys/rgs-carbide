apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: compliance-crd
  namespace: fleet-local
spec:
  repo: https://github.com/zackbradys/rgs-carbide
  branch: main
  paths:
    - /fleet/carbide/rancher-compliance-crd
  targets:
  - name: carbide
    clusterSelector:
      matchLabels:
        carbide: enabled
---
